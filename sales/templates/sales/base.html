<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BizFlow - Sistema de Ventas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-gradient-primary {
            background: linear-gradient(135deg, #007bff, #0056b3) !important;
        }
        .bg-gradient-info {
            background: linear-gradient(135deg, #17a2b8, #117a8b) !important;
        }
        .bg-gradient-warning {
            background: linear-gradient(135deg, #ffc107, #d39e00) !important;
        }
        .bg-gradient-success {
            background: linear-gradient(135deg, #28a745, #1e7e34) !important;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease;
        }
        .text-white h3, .text-white p {
            color: #ffffff !important;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .avatar-sm {
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{% url 'sales:dashboard' %}">
                <i class="fas fa-chart-line me-2"></i>BizFlow
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'sales:dashboard' %}">Dashboard</a>
                <a class="nav-link" href="{% url 'sales:products' %}">Products</a>
                <a class="nav-link" href="/admin/">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
